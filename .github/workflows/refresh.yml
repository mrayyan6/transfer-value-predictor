name: Refresh data

# Once a month: pull the latest stats and values, and only if the player
# table changed, retrain, re-export and commit. Vercel redeploys on the push.
on:
  schedule:
    - cron: "0 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # the export test runs the browser models through node
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pip install -r requirements.txt

      - name: Fetch stats and market values
        run: python data_loader.py --refresh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/processed/players.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Player table is the same as last time, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrain, export and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          python model.py
          python export_web.py
          python -m pytest -q

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed models reports web/data
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
